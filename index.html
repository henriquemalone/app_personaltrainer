<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0e0f11">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Treino">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" href="icon-192.png">
<title>Treino</title>
<style>
  :root{
    --bg:#0e0f11; --card:#17191c; --card2:#1f2226; --line:#2a2e33;
    --tx:#f2f3f5; --mut:#8b929b; --ac:#c6f432; --ac-tx:#111; --ok:#3ddc84; --warn:#ffb020; --bad:#ff5a5a; --bi:#7aa7ff;
    --st:env(safe-area-inset-top); --sb:env(safe-area-inset-bottom);
  }
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
  html,body{height:100%;background:var(--bg)}
  body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;color:var(--tx);overscroll-behavior:none}
  .app{max-width:520px;margin:0 auto;height:100%;display:flex;flex-direction:column;position:relative}
  header{padding:calc(16px + var(--st)) 20px 10px;display:flex;justify-content:space-between;align-items:flex-end;gap:10px}
  header small{color:var(--mut);font-size:13px}
  header h1{font-size:26px;font-weight:700;letter-spacing:-.3px;line-height:1.15}
  .icon-btn{background:var(--card2);border:1px solid var(--line);color:var(--tx);border-radius:12px;width:40px;height:40px;display:grid;place-items:center;cursor:pointer;flex-shrink:0;font-size:15px}
  .icon-btn.sm{width:34px;height:34px;border-radius:10px}
  main{flex:1;overflow-y:auto;padding:4px 16px calc(110px + var(--sb));-webkit-overflow-scrolling:touch}
  body.noauth nav{display:none} body.noauth main{padding-bottom:40px}
  .card{background:var(--card);border-radius:18px;padding:16px;margin-bottom:12px;border:1px solid var(--line)}
  .row{display:flex;align-items:center;justify-content:space-between;gap:10px}
  .left{justify-content:flex-start}
  .tag{display:inline-grid;place-items:center;min-width:44px;height:44px;padding:0 6px;border-radius:12px;background:var(--ac);color:var(--ac-tx);font-weight:800;font-size:18px}
  .mut{color:var(--mut);font-size:13px}
  .btn{display:block;text-align:center;text-decoration:none;background:var(--ac);color:var(--ac-tx);border:0;border-radius:14px;padding:14px;font-weight:700;font-size:15px;width:100%;cursor:pointer}
  .btn:disabled{opacity:.45}
  .btn.ghost{background:var(--card2);color:var(--tx);border:1px solid var(--line)}
  .btn.bad{background:transparent;color:var(--bad);border:1px solid #ff5a5a55}
  .btn.sm{padding:9px 12px;font-size:13px;width:auto;border-radius:10px;display:inline-block}
  .btns{display:flex;gap:8px;flex-wrap:wrap}
  .chip{font-size:12px;padding:4px 10px;border-radius:99px;background:var(--card2);color:var(--mut);white-space:nowrap}
  .chip.warn{background:#ffb02022;color:var(--warn)} .chip.bad{background:#ff5a5a22;color:var(--bad)} .chip.bi{background:#7aa7ff22;color:var(--bi)}
  .banner{border-radius:16px;padding:14px 16px;margin-bottom:12px;font-size:14px;line-height:1.4}
  .banner.bad{background:#ff5a5a1c;border:1px solid #ff5a5a55}
  .banner.warn{background:#ffb0201a;border:1px solid #ffb02055}
  .banner.info{background:var(--card);border:1px solid var(--line)}
  .banner b{display:block;margin-bottom:2px}
  nav{position:absolute;bottom:0;left:0;right:0;display:flex;background:#121315f2;backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-top:1px solid var(--line);padding:8px 0 calc(10px + var(--sb))}
  nav button{flex:1;background:none;border:0;color:var(--mut);font-size:10.5px;display:flex;flex-direction:column;align-items:center;gap:4px;cursor:pointer;position:relative}
  nav button.on{color:var(--ac)}
  nav svg{width:24px;height:24px}
  .dot{position:absolute;top:0;right:calc(50% - 18px);width:8px;height:8px;border-radius:50%;background:var(--ac)}
  .ex h3{font-size:16px;margin-bottom:2px}
  .grp{border-left:3px solid var(--bi);padding-left:12px}
  .grp .ex + .ex{border-top:1px dashed var(--line);margin-top:12px;padding-top:12px}
  table{width:100%;border-collapse:collapse;margin-top:10px;font-size:14px}
  th{color:var(--mut);font-weight:500;font-size:12px;text-align:center;padding-bottom:6px}
  td{text-align:center;padding:4px 2px}
  input,select,textarea{font-family:inherit}
  td input{width:62px;background:var(--card2);border:1px solid var(--line);color:var(--tx);border-radius:9px;padding:9px 4px;text-align:center;font-size:16px}
  .chk{width:38px;height:38px;border-radius:10px;border:1px solid var(--line);background:var(--card2);color:var(--mut);cursor:pointer;font-size:16px}
  tr.done .chk{background:var(--ok);color:#062;border-color:var(--ok)}
  tr.done input{opacity:.55}
  .prev{color:var(--mut);font-size:12px}
  .link{background:none;border:0;color:var(--mut);font-size:13px;cursor:pointer;padding:6px 0}
  .link.ac{color:var(--ac)}
  .timer{position:absolute;left:12px;right:12px;bottom:calc(84px + var(--sb));background:var(--ac);color:var(--ac-tx);border-radius:20px;padding:14px 18px;
         display:none;align-items:center;justify-content:space-between;box-shadow:0 10px 30px #0009;z-index:5}
  .timer.show{display:flex}
  .timer b{font-size:30px;font-variant-numeric:tabular-nums}
  .timer button{background:#0002;border:0;border-radius:10px;padding:9px 10px;font-weight:700;cursor:pointer;color:var(--ac-tx);font-size:14px}
  .stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:12px}
  .stat{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px}
  .stat b{font-size:20px;display:block}
  select{background:var(--card2);color:var(--tx);border:1px solid var(--line);border-radius:10px;padding:8px;font-size:14px;max-width:60%}
  label.f{display:block;font-size:12px;color:var(--mut);margin:12px 0 6px}
  .in{width:100%;background:var(--card2);border:1px solid var(--line);color:var(--tx);border-radius:12px;padding:12px;font-size:16px}
  textarea.in{min-height:220px;resize:vertical;line-height:1.45}
  input[type=date].in{min-height:46px;-webkit-appearance:none;appearance:none}
  .sets{display:grid;grid-template-columns:28px 1fr 1fr 34px;gap:6px;align-items:center;margin-top:8px}
  .sets .h{font-size:11px;color:var(--mut);text-align:center}
  .sets .in{padding:9px 6px;text-align:center}
  .sets .n{color:var(--mut);font-size:13px;text-align:center}
  .exedit{border-top:1px solid var(--line);padding-top:14px;margin-top:14px}
  .exedit.first{border-top:0;margin-top:0;padding-top:0}
  .exedit.bi{border-top:1px dashed var(--bi);margin-top:6px;padding-top:10px;border-left:3px solid var(--bi);padding-left:10px}
  .exedit.bi-head{border-left:3px solid var(--bi);padding-left:10px}
  .linkbar{display:flex;justify-content:center;margin-top:10px}
  .linkbtn{background:var(--card2);border:1px dashed var(--line);color:var(--mut);border-radius:99px;padding:6px 12px;font-size:12px;cursor:pointer}
  .linkbtn.on{border-color:var(--bi);color:var(--bi);border-style:solid}
  .sess{padding:12px 0;border-bottom:1px solid var(--line);cursor:pointer}
  .sess:last-child{border-bottom:0}
  .det{margin-top:8px;font-size:13px;color:var(--mut);line-height:1.6}
  .modal{position:fixed;inset:0;background:#000b;display:none;align-items:flex-end;justify-content:center;z-index:25}
  .modal.show{display:flex}
  .sheet{background:var(--card);border:1px solid var(--line);border-radius:24px 24px 0 0;width:100%;max-width:520px;padding:22px 18px calc(22px + var(--sb));max-height:88vh;overflow-y:auto}
  .sheet h2{font-size:20px;margin-bottom:8px}
  .opt{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:12px 0;border-bottom:1px solid var(--line)}
  .empty{text-align:center;padding:40px 10px;color:var(--mut)}
  .empty b{display:block;color:var(--tx);font-size:18px;margin-bottom:6px}
  .toast{position:fixed;left:50%;top:calc(14px + var(--st));transform:translateX(-50%);background:var(--card2);border:1px solid var(--line);padding:10px 16px;border-radius:12px;font-size:14px;z-index:30;display:none;max-width:90vw;text-align:center}
  .auth{max-width:400px;margin:20px auto 0}
  .logo{display:flex;align-items:center;gap:12px;margin:10px 0 24px}
  .spin{display:inline-block;width:16px;height:16px;border:2px solid currentColor;border-right-color:transparent;border-radius:50%;animation:sp .8s linear infinite;vertical-align:-3px;margin-right:6px}
  @keyframes sp{to{transform:rotate(360deg)}}
  .sync{font-size:11px;color:var(--mut)}
  .kpis{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:12px}
  .kpi{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px}
  .kpi b{font-size:22px;display:block;margin:2px 0}
  .seg{display:flex;background:var(--card2);border-radius:12px;padding:3px;margin-bottom:12px}
  .seg button{flex:1;background:none;border:0;color:var(--mut);padding:9px;border-radius:9px;font-size:13px;font-weight:600;cursor:pointer}
  .seg button.on{background:var(--card);color:var(--tx)}
  .fgrid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
  .fgrid label{font-size:11px;color:var(--mut);display:block;margin-bottom:4px}
  .fgrid .in{padding:10px}
  .cmp{margin-top:6px} .cmp td,.cmp th{text-align:right;padding:8px 4px;border-bottom:1px solid var(--line);font-size:13px}
  .cmp td:first-child,.cmp th:first-child{text-align:left;color:var(--tx)}
  .cmp tr.sec td{color:var(--mut);font-size:11px;text-transform:uppercase;letter-spacing:.5px;padding-top:14px;border-bottom:0}
  details{border-top:1px solid var(--line);padding:12px 0;margin-top:12px}
  details summary{cursor:pointer;font-weight:600;list-style:none;display:flex;justify-content:space-between}
  details summary::-webkit-details-marker{display:none}
  details summary::after{content:'+';color:var(--mut)} details[open] summary::after{content:'–'}
  .calc{background:#c6f43214;border:1px solid #c6f43240;border-radius:12px;padding:10px 12px;font-size:13px;margin-top:10px;line-height:1.6}
  /* ---- treino passo a passo ---- */
  body.emtreino header, body.emtreino nav{display:none}
  body.emtreino main{padding:0 14px calc(150px + var(--sb))}
  .ttop{display:flex;align-items:center;justify-content:space-between;padding:calc(12px + var(--st)) 0 10px;position:sticky;top:0;background:var(--bg);z-index:3}
  .ttop button{background:none;border:0;color:var(--ac);font-size:22px;width:40px;height:40px;cursor:pointer}
  .ttop div{text-align:center;min-width:0} .ttop b{font-size:15px;display:block} .ttop small{color:var(--mut);font-size:12px}
  .tprog{height:3px;background:var(--card2);margin:0 -14px 14px} .tprog i{display:block;height:100%;background:var(--ac);transition:width .3s}
  .exhead{display:flex;gap:12px;align-items:center;cursor:pointer;border-radius:16px;background:var(--card);padding:8px;border:1px solid var(--line);margin-bottom:8px}
  .exhead h3,.combo h3{font-size:15px;line-height:1.25}
  .thumb{width:96px;height:64px;border-radius:10px;flex-shrink:0;position:relative;overflow:hidden;background:linear-gradient(135deg,#2c3340,#151820);display:grid;place-items:center}
  .thumb img{width:100%;height:100%;object-fit:cover}
  .play{position:absolute;right:6px;bottom:6px;width:22px;height:22px;border-radius:50%;background:#000a;display:grid;place-items:center;font-size:10px}
  .badge{position:absolute;left:6px;bottom:6px;width:22px;height:22px;border-radius:50%;display:grid;place-items:center;font-size:11px;font-weight:800;color:#fff}
  .info{color:var(--mut);font-size:20px;padding:0 6px}
  .combo{display:flex;border-radius:16px;overflow:hidden;border:1px solid var(--line);background:var(--card);margin-bottom:8px}
  .combo .rows{flex:1;min-width:0} .combo .r{display:flex;gap:12px;align-items:center;padding:8px;cursor:pointer} .combo .r+.r{border-top:1px solid var(--line)}
  .combo .side{writing-mode:vertical-rl;background:#7aa7ff22;color:var(--bi);font-size:12px;font-weight:700;display:grid;place-items:center;padding:0 6px;letter-spacing:1px}
  .notes{margin:10px 2px 4px;font-size:14px;line-height:1.5} .notes small{color:var(--mut);font-size:12px;display:block;margin-bottom:2px}
  .tabs{display:flex;border-bottom:1px solid var(--line);margin:10px 0 6px}
  .tabs button{flex:1;background:none;border:0;color:var(--mut);padding:11px 4px;font-size:14px;font-weight:600;border-bottom:2px solid transparent;cursor:pointer}
  .tabs button.on{color:var(--ac);border-color:var(--ac)}
  .tmeta{color:var(--mut);font-size:12px;text-align:center;margin:6px 0 4px}
  .rhead{display:grid;grid-template-columns:44px 1fr;gap:8px;font-size:11px;color:var(--mut);text-align:center}
  .rhead .ln,.round .ln{display:grid;grid-template-columns:26px 1fr 12px 1fr 30px;gap:6px;align-items:center;padding:5px 0}
  .rhead .ln{padding:0 8px}
  .round{display:grid;grid-template-columns:44px 1fr;gap:8px;align-items:center;padding:7px 0;border-bottom:1px solid var(--line)}
  .round .n{width:38px;height:38px;border-radius:50%;border:2px solid var(--line);background:none;display:grid;place-items:center;font-weight:700;color:var(--mut);font-size:15px;cursor:pointer}
  .round.cur .n{border-color:var(--ac);color:var(--ac)} .round.done .n{background:var(--ok);border-color:var(--ok);color:#062}
  .round .box{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:3px 8px}
  .round .ln+.ln{border-top:1px solid var(--line)}
  .round .b{width:24px;height:24px;border-radius:50%;display:grid;place-items:center;font-size:11px;font-weight:800;color:#fff}
  .round input{width:100%;background:var(--card2);border:1px solid var(--line);color:var(--tx);border-radius:10px;padding:9px 2px;text-align:center;font-size:16px;font-weight:600}
  .round.done input{opacity:.55}
  .round .x{color:var(--mut);text-align:center;font-size:13px}
  .round .pv{font-size:10px;color:var(--mut);grid-column:2/5;margin-top:-3px;text-align:center}
  .mini{background:none;border:0;color:var(--mut);font-size:18px;cursor:pointer}
  .add{background:none;border:1px dashed var(--line);color:var(--mut);border-radius:12px;padding:11px;width:100%;margin-top:10px;cursor:pointer;font-size:14px}
  #tBar{position:absolute;left:0;right:0;bottom:0;border-top:1px solid var(--line);padding:10px 14px calc(14px + var(--sb));background:#121315f5;backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);z-index:6;display:none}
  #tRest{display:none;align-items:center;justify-content:center;gap:18px;padding:2px 0 10px}
  #tRest b{font-size:30px;color:var(--ac);font-variant-numeric:tabular-nums;min-width:100px;text-align:center}
  #tRest button{background:none;border:0;color:var(--mut);font-size:15px;cursor:pointer;padding:6px}
  #tRest .skip{color:var(--ac);font-weight:700}
  .tact{display:flex;gap:8px} .tact .btn{padding:15px;font-size:16px} .tact .more{flex:0 0 56px;width:56px;font-size:20px}
  .btn.tnext{background:var(--ok);color:#062}
  .mi{display:flex;align-items:center;gap:12px;padding:14px 4px;border-bottom:1px solid var(--line);cursor:pointer;font-size:15px}
  .mi span:first-child{width:26px;text-align:center} .mi.bad{color:var(--bad)}
  .li{display:flex;align-items:center;gap:10px;padding:11px 4px;border-bottom:1px solid var(--line);cursor:pointer}
  .li .st{width:24px;height:24px;border-radius:50%;display:grid;place-items:center;font-size:12px;border:2px solid var(--line);flex-shrink:0}
  .li.done .st{background:var(--ok);border-color:var(--ok);color:#062} .li.cur .st{border-color:var(--ac);color:var(--ac)} .li.skip .st{border-color:var(--warn);color:var(--warn)}
  /* tela do exercício */
  #exTela{position:fixed;inset:0;background:var(--bg);display:none;flex-direction:column;z-index:15;max-width:520px;margin:0 auto}
  #exTela.show{display:flex}
  .exh{display:flex;align-items:center;gap:8px;padding:calc(12px + var(--st)) 10px 10px}
  .exh button{background:none;border:0;color:var(--ac);font-size:22px;cursor:pointer;width:40px;height:40px}
  .exh b{flex:1;text-align:center;font-size:15px;line-height:1.3}
  #exVideo{aspect-ratio:16/9;width:100%;min-height:200px;background:#000;display:grid;place-items:center}
  #exVideo iframe{width:100%;height:100%;border:0}
  .semvid{text-align:center;color:var(--mut);font-size:13px;padding:16px;display:flex;flex-direction:column;align-items:center}
  #exTabs{display:flex;border-bottom:1px solid var(--line);margin:0}
  #exBody{flex:1;overflow-y:auto;padding:14px 16px calc(24px + var(--sb))}
  ol.dicas{padding-left:20px;line-height:1.55;font-size:14px;margin-top:8px} ol.dicas li{margin-bottom:6px}
  .vopt{display:flex;gap:10px;align-items:center;padding:9px 0;border-bottom:1px solid var(--line);cursor:pointer}
  .vopt img{width:96px;height:54px;object-fit:cover;border-radius:8px;flex-shrink:0} .vopt.on img{outline:2px solid var(--ac)}
  /* ---- dieta ---- */
  .datenav{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
  .datenav button{background:var(--card2);border:1px solid var(--line);color:var(--tx);border-radius:10px;width:36px;height:36px;font-size:16px;cursor:pointer}
  .datenav b{font-size:15px}
  .kcal{display:flex;gap:14px;align-items:center}
  .ring{width:96px;height:96px;flex-shrink:0;position:relative}
  .ring>div{position:absolute;inset:0;display:grid;place-items:center;text-align:center;line-height:1.1}
  .ring b{font-size:20px} .ring small{font-size:11px;color:var(--mut)}
  .mrow{margin-bottom:8px} .mrow .row{font-size:12px;margin-bottom:3px}
  .mbar{height:7px;background:var(--card2);border-radius:9px;overflow:hidden} .mbar i{display:block;height:100%;border-radius:9px}
  .agua{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}
  .copo{width:30px;height:36px;border-radius:4px 4px 8px 8px;border:2px solid var(--line);background:none;cursor:pointer}
  .copo.on{border-color:#38bdf8;background:linear-gradient(to top,#38bdf855 75%,transparent 75%)}
  .meal{background:var(--card);border:1px solid var(--line);border-radius:18px;margin-bottom:10px;overflow:hidden}
  .meal.done{border-color:#3ddc8466}
  .mh{display:flex;align-items:center;gap:12px;padding:12px 14px;cursor:pointer}
  .mh .ck{width:30px;height:30px;border-radius:50%;border:2px solid var(--line);display:grid;place-items:center;flex-shrink:0;background:none;color:transparent;font-weight:800;cursor:pointer}
  .meal.done .ck{background:var(--ok);border-color:var(--ok);color:#062} .meal.skip .ck{border-color:var(--warn);color:var(--warn)}
  .mh .t{flex:1;min-width:0} .mh b{font-size:15px} .mh .mut{font-size:12px}
  .mh .k{font-size:13px;font-weight:700;text-align:right;white-space:nowrap}
  .items{border-top:1px solid var(--line);padding:6px 14px 12px}
  .it{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px dashed var(--line);font-size:14px} .it:last-child{border-bottom:0}
  .it .q{color:var(--mut);font-size:12px} .it.troc .nm{color:var(--ac)}
  .it .sw{background:var(--card2);border:1px solid var(--line);color:var(--tx);border-radius:9px;padding:5px 8px;font-size:12px;cursor:pointer;white-space:nowrap}
  .mbtns{display:flex;gap:8px;margin-top:10px}
  .kpis3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:12px}
  .kpis3 .kpi b{font-size:19px}
  .days{display:flex;align-items:flex-end;gap:5px;height:120px;margin-top:12px}
  .days>div{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;font-size:10px;color:var(--mut)}
  .days i{display:block;width:100%;border-radius:5px 5px 2px 2px}
  .grid5{display:grid;grid-template-columns:1.4fr 1fr 1fr 1fr 1fr;gap:5px}
  .grid5 span{font-size:11px;color:var(--mut);display:block;text-align:center;margin-bottom:3px}
  .grid5 .in{padding:8px 4px;text-align:center;font-size:14px}
  .qtdrow{display:grid;grid-template-columns:1fr 1.6fr;gap:6px;margin-bottom:6px}
  .qtdrow span,.grid4m span{font-size:11px;color:var(--mut);display:block;margin-bottom:3px}
