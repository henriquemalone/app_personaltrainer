<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0e0f11">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Treino">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" href="icon-192.png">
<title>Treino</title>
<style>
  :root{
    --bg:#0e0f11; --card:#17191c; --card2:#1f2226; --line:#2a2e33;
    --tx:#f2f3f5; --mut:#8b929b; --ac:#c6f432; --ac-tx:#111; --ok:#3ddc84; --warn:#ffb020; --bad:#ff5a5a; --bi:#7aa7ff;
    --st:env(safe-area-inset-top); --sb:env(safe-area-inset-bottom);
  }
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
  html,body{height:100%;background:var(--bg)}
  body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;color:var(--tx);overscroll-behavior:none}
  .app{max-width:520px;margin:0 auto;height:100%;display:flex;flex-direction:column;position:relative}
  header{padding:calc(16px + var(--st)) 20px 10px;display:flex;justify-content:space-between;align-items:flex-end;gap:10px}
  header small{color:var(--mut);font-size:13px}
  header h1{font-size:26px;font-weight:700;letter-spacing:-.3px;line-height:1.15}
  .icon-btn{background:var(--card2);border:1px solid var(--line);color:var(--tx);border-radius:12px;width:40px;height:40px;display:grid;place-items:center;cursor:pointer;flex-shrink:0;font-size:15px}
  .icon-btn.sm{width:34px;height:34px;border-radius:10px}
  main{flex:1;overflow-y:auto;padding:4px 16px calc(110px + var(--sb));-webkit-overflow-scrolling:touch}
  body.noauth nav{display:none} body.noauth main{padding-bottom:40px}
  .card{background:var(--card);border-radius:18px;padding:16px;margin-bottom:12px;border:1px solid var(--line)}
  .row{display:flex;align-items:center;justify-content:space-between;gap:10px}
  .left{justify-content:flex-start}
  .tag{display:inline-grid;place-items:center;min-width:44px;height:44px;padding:0 6px;border-radius:12px;background:var(--ac);color:var(--ac-tx);font-weight:800;font-size:18px}
  .mut{color:var(--mut);font-size:13px}
  .btn{display:block;text-align:center;text-decoration:none;background:var(--ac);color:var(--ac-tx);border:0;border-radius:14px;padding:14px;font-weight:700;font-size:15px;width:100%;cursor:pointer}
  .btn:disabled{opacity:.45}
  .btn.ghost{background:var(--card2);color:var(--tx);border:1px solid var(--line)}
  .btn.bad{background:transparent;color:var(--bad);border:1px solid #ff5a5a55}
  .btn.sm{padding:9px 12px;font-size:13px;width:auto;border-radius:10px;display:inline-block}
  .btns{display:flex;gap:8px;flex-wrap:wrap}
  .chip{font-size:12px;padding:4px 10px;border-radius:99px;background:var(--card2);color:var(--mut);white-space:nowrap}
  .chip.warn{background:#ffb02022;color:var(--warn)} .chip.bad{background:#ff5a5a22;color:var(--bad)} .chip.bi{background:#7aa7ff22;color:var(--bi)}
  .banner{border-radius:16px;padding:14px 16px;margin-bottom:12px;font-size:14px;line-height:1.4}
  .banner.bad{background:#ff5a5a1c;border:1px solid #ff5a5a55}
  .banner.warn{background:#ffb0201a;border:1px solid #ffb02055}
  .banner.info{background:var(--card);border:1px solid var(--line)}
  .banner b{display:block;margin-bottom:2px}
  nav{position:absolute;bottom:0;left:0;right:0;display:flex;background:#121315f2;backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-top:1px solid var(--line);padding:8px 0 calc(10px + var(--sb))}
  nav button{flex:1;background:none;border:0;color:var(--mut);font-size:11px;display:flex;flex-direction:column;align-items:center;gap:4px;cursor:pointer;position:relative}
  nav button.on{color:var(--ac)}
  nav svg{width:24px;height:24px}
  .dot{position:absolute;top:0;right:calc(50% - 18px);width:8px;height:8px;border-radius:50%;background:var(--ac)}
  .ex h3{font-size:16px;margin-bottom:2px}
  .grp{border-left:3px solid var(--bi);padding-left:12px}
  .grp .ex + .ex{border-top:1px dashed var(--line);margin-top:12px;padding-top:12px}
  table{width:100%;border-collapse:collapse;margin-top:10px;font-size:14px}
  th{color:var(--mut);font-weight:500;font-size:12px;text-align:center;padding-bottom:6px}
  td{text-align:center;padding:4px 2px}
  input,select,textarea{font-family:inherit}
  td input{width:62px;background:var(--card2);border:1px solid var(--line);color:var(--tx);border-radius:9px;padding:9px 4px;text-align:center;font-size:16px}
  .chk{width:38px;height:38px;border-radius:10px;border:1px solid var(--line);background:var(--card2);color:var(--mut);cursor:pointer;font-size:16px}
  tr.done .chk{background:var(--ok);color:#062;border-color:var(--ok)}
  tr.done input{opacity:.55}
  .prev{color:var(--mut);font-size:12px}
  .link{background:none;border:0;color:var(--mut);font-size:13px;cursor:pointer;padding:6px 0}
  .link.ac{color:var(--ac)}
  .timer{position:absolute;left:12px;right:12px;bottom:calc(84px + var(--sb));background:var(--ac);color:var(--ac-tx);border-radius:20px;padding:14px 18px;
         display:none;align-items:center;justify-content:space-between;box-shadow:0 10px 30px #0009;z-index:5}
  .timer.show{display:flex}
  .timer b{font-size:30px;font-variant-numeric:tabular-nums}
  .timer button{background:#0002;border:0;border-radius:10px;padding:9px 10px;font-weight:700;cursor:pointer;color:var(--ac-tx);font-size:14px}
  .stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:12px}
  .stat{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px}
  .stat b{font-size:20px;display:block}
  select{background:var(--card2);color:var(--tx);border:1px solid var(--line);border-radius:10px;padding:8px;font-size:14px;max-width:60%}
  label.f{display:block;font-size:12px;color:var(--mut);margin:12px 0 6px}
  .in{width:100%;background:var(--card2);border:1px solid var(--line);color:var(--tx);border-radius:12px;padding:12px;font-size:16px}
  textarea.in{min-height:220px;resize:vertical;line-height:1.45}
  input[type=date].in{min-height:46px;-webkit-appearance:none;appearance:none}
  .sets{display:grid;grid-template-columns:28px 1fr 1fr 34px;gap:6px;align-items:center;margin-top:8px}
  .sets .h{font-size:11px;color:var(--mut);text-align:center}
  .sets .in{padding:9px 6px;text-align:center}
  .sets .n{color:var(--mut);font-size:13px;text-align:center}
  .exedit{border-top:1px solid var(--line);padding-top:14px;margin-top:14px}
  .exedit.first{border-top:0;margin-top:0;padding-top:0}
  .exedit.bi{border-top:1px dashed var(--bi);margin-top:6px;padding-top:10px;border-left:3px solid var(--bi);padding-left:10px}
  .exedit.bi-head{border-left:3px solid var(--bi);padding-left:10px}
  .linkbar{display:flex;justify-content:center;margin-top:10px}
  .linkbtn{background:var(--card2);border:1px dashed var(--line);color:var(--mut);border-radius:99px;padding:6px 12px;font-size:12px;cursor:pointer}
  .linkbtn.on{border-color:var(--bi);color:var(--bi);border-style:solid}
  .sess{padding:12px 0;border-bottom:1px solid var(--line);cursor:pointer}
  .sess:last-child{border-bottom:0}
  .det{margin-top:8px;font-size:13px;color:var(--mut);line-height:1.6}
  .modal{position:fixed;inset:0;background:#000b;display:none;align-items:flex-end;justify-content:center;z-index:20}
  .modal.show{display:flex}
  .sheet{background:var(--card);border:1px solid var(--line);border-radius:24px 24px 0 0;width:100%;max-width:520px;padding:22px 18px calc(22px + var(--sb));max-height:88vh;overflow-y:auto}
  .sheet h2{font-size:20px;margin-bottom:8px}
  .opt{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:12px 0;border-bottom:1px solid var(--line)}
  .empty{text-align:center;padding:40px 10px;color:var(--mut)}
  .empty b{display:block;color:var(--tx);font-size:18px;margin-bottom:6px}
  .toast{position:fixed;left:50%;top:calc(14px + var(--st));transform:translateX(-50%);background:var(--card2);border:1px solid var(--line);padding:10px 16px;border-radius:12px;font-size:14px;z-index:30;display:none;max-width:90vw;text-align:center}
  .auth{max-width:400px;margin:20px auto 0}
  .logo{display:flex;align-items:center;gap:12px;margin:10px 0 24px}
  .spin{display:inline-block;width:16px;height:16px;border:2px solid currentColor;border-right-color:transparent;border-radius:50%;animation:sp .8s linear infinite;vertical-align:-3px;margin-right:6px}
  @keyframes sp{to{transform:rotate(360deg)}}
  .sync{font-size:11px;color:var(--mut)}
  .kpis{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:12px}
  .kpi{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px}
  .kpi b{font-size:22px;display:block;margin:2px 0}
  .seg{display:flex;background:var(--card2);border-radius:12px;padding:3px;margin-bottom:12px}
  .seg button{flex:1;background:none;border:0;color:var(--mut);padding:9px;border-radius:9px;font-size:13px;font-weight:600;cursor:pointer}
  .seg button.on{background:var(--card);color:var(--tx)}
  .fgrid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
  .fgrid label{font-size:11px;color:var(--mut);display:block;margin-bottom:4px}
  .fgrid .in{padding:10px}
  .cmp{margin-top:6px} .cmp td,.cmp th{text-align:right;padding:8px 4px;border-bottom:1px solid var(--line);font-size:13px}
  .cmp td:first-child,.cmp th:first-child{text-align:left;color:var(--tx)}
  .cmp tr.sec td{color:var(--mut);font-size:11px;text-transform:uppercase;letter-spacing:.5px;padding-top:14px;border-bottom:0}
  details{border-top:1px solid var(--line);padding:12px 0;margin-top:12px}
  details summary{cursor:pointer;font-weight:600;list-style:none;display:flex;justify-content:space-between}
  details summary::-webkit-details-marker{display:none}
  details summary::after{content:'+';color:var(--mut)} details[open] summary::after{content:'–'}
  .calc{background:#c6f43214;border:1px solid #c6f43240;border-radius:12px;padding:10px 12px;font-size:13px;margin-top:10px;line-height:1.6}
</style>
</head>
<body class="noauth">
<div class="app">
  <header>
    <div><small id="sub"></small><h1 id="ttl">Treino</h1></div>
    <button class="icon-btn" id="hdrBtn" aria-label="Ajustes" style="visibility:hidden" onclick="A.go('ajustes')">
      <svg width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg>
    </button>
  </header>
  <main id="view"><div class="empty"><span class="spin"></span>Carregando…</div></main>
  <div class="timer" id="timer">
    <div><div style="font-size:12px;font-weight:600;opacity:.7" id="tmLbl">DESCANSO</div><b id="tm">00:00</b></div>
    <div style="display:flex;gap:6px"><button onclick="A.addT(-15)">−15s</button><button onclick="A.addT(15)">+15s</button><button onclick="A.stopT()">Pular</button></div>
  </div>
  <nav>
    <button data-v="fichas" onclick="A.go('fichas')"><svg fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><rect x="4" y="3" width="16" height="18" rx="3"/><path d="M8 8h8M8 12h8M8 16h5"/></svg>Fichas</button>
    <button data-v="treino" onclick="A.go('treino')"><span class="dot" id="navDot" style="display:none"></span><svg fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M6 7v10M18 7v10M3 10v4M21 10v4M6 12h12"/></svg>Treinar</button>
    <button data-v="evolucao" onclick="A.go('evolucao')"><svg fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/></svg>Cargas</button>
    <button data-v="medidas" onclick="A.go('medidas')"><svg fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M3 8h18v8H3z"/><path d="M7 8v3M11 8v4M15 8v3M19 8v4"/></svg>Medidas</button>
  </nav>
</div>
<div class="modal" id="modal" onclick="if(event.target===this)A.closeModal()"><div class="sheet" id="sheet"></div></div>
<div class="toast" id="toast"></div>
<input type="file" id="fileIn" accept="application/json,.json" style="display:none" onchange="A.importarArquivo(this)">
<script type="module" src="app.js"></script>
</body>
</html>
